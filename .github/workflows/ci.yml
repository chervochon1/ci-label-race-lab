name: CI
# Design D: no `labeled`. For a "Dependabot" PR (title contains DEPBOT,
# standing in for github.actor == dependabot[bot]) the review job skips at
# the CALLER level, so CI reports no `gate / check` at all (not a pass, not
# a failure); the re-run workflow must supply it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate:
    if: ${{ !contains(github.event.pull_request.title, 'DEPBOT') }}
    uses: ./.github/workflows/inner.yml
    with:
      pass: true
