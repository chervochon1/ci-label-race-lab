name: CI review re-run
# Design B: the run-ai-reviews re-run lives in its own workflow. The same
# caller job id `gate` reports the same context `gate / check` (and passes,
# like a review that really ran). Any other label skips `gate` at the caller
# level, which reports a check named just `gate`.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  gate:
    if: github.event.label.name == 'run-ai-reviews'
    uses: ./.github/workflows/inner.yml
    with:
      pass: true
