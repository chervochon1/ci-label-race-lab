name: CI review re-run
# Design D2: run on ANY label event while the PR carries run-ai-reviews, so
# a later unrelated label re-reports `gate / check` instead of leaving a
# skipped run as the latest one of this workflow.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'run-ai-reviews')
    uses: ./.github/workflows/inner.yml
    with:
      pass: true
